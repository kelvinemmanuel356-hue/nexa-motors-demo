<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexa Homes | Find Your Perfect Home</title>

  <meta name="description" content="Nexa Homes - Premium properties for sale and rent. Find your perfect home with us.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f5;
      color: #161616;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    button,
    input,
    select {
      font: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 22px 6%;
      color: white;
    }

    .nav {
      max-width: 1250px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      font-weight: 400;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      align-items: center;
      list-style: none;
    }

    .nav-links a {
      color: white;
      font-size: 15px;
      transition: 0.3s;
    }

    .nav-links a:hover {
      opacity: 0.65;
    }

    .nav-btn {
      background: white;
      color: #111 !important;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: bold;
    }

    .menu {
      display: none;
      font-size: 27px;
      cursor: pointer;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 760px;
      position: relative;
      display: flex;
      align-items: center;
      background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.35)),
        url("https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=2000&q=85")
        center/cover;
      color: white;
    }

    .hero-content {
      width: 90%;
      max-width: 1250px;
      margin: 100px auto 0;
    }

    .hero-tag {
      display: inline-block;
      padding: 8px 15px;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 30px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(45px, 7vw, 82px);
      line-height: 1.02;
      max-width: 800px;
      letter-spacing: -3px;
      margin-bottom: 25px;
    }

    .hero p {
      max-width: 600px;
      font-size: 18px;
      color: #eee;
      margin-bottom: 35px;
    }

    .hero-buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 15px 25px;
      border-radius: 7px;
      font-weight: bold;
      transition: .3s;
      border: none;
      cursor: pointer;
    }

    .btn-dark {
      background: #111;
      color: white;
    }

    .btn-white {
      background: white;
      color: #111;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      width: 88%;
      max-width: 1100px;
      margin: -60px auto 80px;
      position: relative;
      z-index: 10;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 15px 45px rgba(0,0,0,.12);
    }

    .search-box h3 {
      margin-bottom: 17px;
      font-size: 20px;
    }

    .search-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 12px;
    }

    .search-grid input,
    .search-grid select {
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 7px;
      background: white;
      outline: none;
    }

    .search-grid button {
      padding: 15px 25px;
      background: #111;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    /* =========================
       GENERAL
    ========================= */

    section {
      padding: 90px 6%;
    }

    .container {
      max-width: 1250px;
      margin: auto;
    }

    .section-top {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 30px;
      margin-bottom: 40px;
    }

    .eyebrow {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
      color: #777;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: clamp(32px, 4vw, 52px);
      line-height: 1.1;
      letter-spacing: -2px;
    }

    .section-description {
      max-width: 500px;
      color: #666;
    }

    /* =========================
       PROPERTIES
    ========================= */

    .property-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .property-card {
      background: white;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 5px 25px rgba(0,0,0,.06);
      transition: .3s;
    }

    .property-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 15px 35px rgba(0,0,0,.12);
    }

    .property-image {
      height: 270px;
      position: relative;
    }

    .property-image img {
      height: 100%;
    }

    .badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: white;
      color: #111;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .property-content {
      padding: 22px;
    }

    .property-content h3 {
      font-size: 21px;
      margin-bottom: 6px;
    }

    .location {
      color: #777;
      font-size: 14px;
      margin-bottom: 17px;
    }

    .property-info {
      display: flex;
      gap: 18px;
      font-size: 13px;
      color: #555;
      margin-bottom: 20px;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }

    .price {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .property-btn {
      display: block;
      text-align: center;
      background: #111;
      color: white;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    /* =========================
       ABOUT
    ========================= */

    .about {
      background: #111;
      color: white;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .about-image {
      height: 560px;
      border-radius: 12px;
      overflow: hidden;
    }

    .about-image img {
      height: 100%;
    }

    .about .eyebrow {
      color: #aaa;
    }

    .about h2 {
      font-size: clamp(35px, 5vw, 58px);
      line-height: 1.08;
      letter-spacing: -2px;
      margin-bottom: 25px;
    }

    .about p {
      color: #ccc;
      margin-bottom: 25px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 35px;
    }

    .stat {
      border-top: 1px solid #444;
      padding-top: 15px;
    }

    .stat strong {
      font-size: 30px;
      display: block;
    }

    .stat span {
      color: #999;
      font-size: 13px;
    }

    /* =========================
       SERVICES
    ========================= */

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .service {
      padding: 35px;
      background: white;
      border: 1px solid #e9e9e9;
      border-radius: 12px;
    }

    .service-number {
      font-size: 13px;
      color: #999;
      margin-bottom: 35px;
    }

    .service h3 {
      font-size: 24px;
      margin-bottom: 12px;
    }

    .service p {
      color: #666;
      font-size: 14px;
    }

    /* =========================
       WHY US
    ========================= */

    .why {
      background: #ecece8;
    }

    .why-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .why-card {
      padding: 30px;
      background: white;
      border-radius: 10px;
    }

    .why-icon {
      font-size: 30px;
      margin-bottom: 25px;
    }

    .why-card h3 {
      margin-bottom: 10px;
    }

    .why-card p {
      font-size: 14px;
      color: #666;
    }

    /* =========================
       TESTIMONIALS
    ========================= */

    .testimonials {
      background: white;
    }

    .testimonial-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .testimonial {
      padding: 30px;
      border: 1px solid #eee;
      border-radius: 10px;
    }

    .stars {
      margin-bottom: 20px;
      letter-spacing: 3px;
    }

    .testimonial p {
      color: #555;
      margin-bottom: 25px;
    }

    .person {
      font-weight: bold;
    }

    .person small {
      display: block;
      color: #888;
      font-weight: normal;
      margin-top: 3px;
    }

    /* =========================
       CTA
    ========================= */

    .cta {
      padding: 110px 6%;
      background:
        linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
        url("https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1800&q=85")
        center/cover;
      color: white;
      text-align: center;
    }

    .cta h2 {
      font-size: clamp(38px, 5vw, 62px);
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .cta p {
      max-width: 600px;
      margin: 0 auto 30px;
      color: #ddd;
    }

    /* =========================
       CONTACT
    ========================= */

    .contact-grid {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 50px;
    }

    .contact-details h2 {
      font-size: 45px;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .contact-details p {
      color: #666;
      margin-bottom: 25px;
    }

    .contact-item {
      padding: 15px 0;
      border-bottom: 1px solid #ddd;
    }

    .contact-item strong {
      display: block;
      margin-bottom: 3px;
    }

    .contact-item span {
      color: #666;
    }

    .contact-form {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 30px rgba(0,0,0,.07);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .contact-form input,
    .contact-form select,
    .contact-form textarea {
      width: 100%;
      border: 1px solid #ddd;
      padding: 14px;
      border-radius: 6px;
      margin-bottom: 15px;
      outline: none;
    }

    .contact-form textarea {
      height: 140px;
      resize: vertical;
    }

    .contact-form button {
      width: 100%;
      background: #111;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #111;
      color: white;
      padding: 60px 6% 25px;
    }

    .footer-grid {
      max-width: 1250px;
      margin: auto;
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr;
      gap: 40px;
      padding-bottom: 45px;
    }

    footer h3 {
      margin-bottom: 15px;
    }

    footer p,
    footer a {
      color: #999;
      font-size: 14px;
    }

    footer a {
      display: block;
      margin-bottom: 8px;
    }

    .copyright {
      max-width: 1250px;
      margin: auto;
      border-top: 1px solid #333;
      padding-top: 20px;
      color: #777;
      font-size: 13px;
    }

    /* =========================
       WHATSAPP FLOAT
    ========================= */

    .whatsapp {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 58px;
      height: 58px;
      background: #25D366;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      z-index: 9999;
      box-shadow: 0 5px 20px rgba(0,0,0,.2);
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width: 900px) {

      .nav-links {
        position: absolute;
        top: 75px;
        right: 6%;
        width: 240px;
        background: #111;
        padding: 25px;
        border-radius: 10px;
        display: none;
        flex-direction: column;
        align-items: flex
